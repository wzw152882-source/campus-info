const META = DATA[DATA.length-1].meta || ""; DATA.pop();
const $ = id => document.getElementById(id);
let cat = "";
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const uniq = a => [...new Set(a)];

function counts(){ const c={}; DATA.forEach(x=>c[x.cat]=(c[x.cat]||0)+1);
  return Object.entries(c).sort((a,b)=>b[1]-a[1]); }

function renderStats(){
  const cs=counts(), max=Math.max(...cs.map(x=>x[1]));
  let h=`<div class="chip ${cat===""?"on":""}" onclick="setCat('')">全部 ${DATA.length}</div>`;
  cs.forEach(([n,c])=>{ h+=`<div class="chip ${cat===n?"on":""}" onclick="setCat('${n}')">${n} ${c}</div>`; });
  h+=`<div class="chip" style="border-style:dashed;color:#A32D2D" onclick="setCat('__dl')">含截止时间 ${DATA.filter(x=>x.dl).length}</div>`;
  $("stats").innerHTML=h;
}
function setCat(c){ cat=(cat===c?"":c); renderStats(); render(); }

function render(){
  const rel=$("fRel").value, src=$("fSource").value, yr=$("fYear").value,
        q=$("q").value.trim().toLowerCase();
  const rows=DATA.filter(x=>
    (!cat||cat==="__dl"?x.dl:x.cat===cat) && (!rel||x.by===rel) && (!src||x.src===src) &&
    (!yr||x.date.startsWith(yr)) &&
    (!q||x.title.toLowerCase().includes(q)||(x.sum||"").toLowerCase().includes(q)));
  rows.sort((a,b)=>b.date.localeCompare(a.date));
  let h="", last="";
  if(!rows.length){ h=`<div class="empty">没有匹配的通知</div>`; }
  rows.forEach(x=>{
    if(x.date!==last){
      if(last) h+="</div>";
      h+=`<div class="day">${x.date}<span class="n">${rows.filter(r=>r.date===x.date).length} 条</span></div><div>`;
      last=x.date;
    }
    const dl=x.dl?`<span class="dl">截止 ${esc(x.dl)}</span>`:"";
    h+=`<div class="card"><div class="t1"><span class="tag c-${x.cat}">${x.cat}</span>`+
       `<span class="tag b-${x.by}">保研${x.by}</span>${dl}`+
       `<a href="${x.url}" target="_blank">${esc(x.title)}</a></div>`+
       (x.sum?`<div class="sum">${esc(x.sum)}</div>`:"")+
       `<div class="meta">${x.src}</div></div>`;
  });
  if(last) h+="</div>";
  $("list").innerHTML=h;
  $("sub").textContent=`共 ${DATA.length} 条 · 显示 ${rows.length} 条 · 生成于 ${META} · 点标题看原文`;
}

uniq(DATA.map(x=>x.src)).forEach(s=>{const o=document.createElement("option");o.textContent=s;$("fSource").appendChild(o);});
uniq(DATA.map(x=>x.date.slice(0,4))).sort().reverse().forEach(y=>{const o=document.createElement("option");o.textContent=y;$("fYear").appendChild(o);});
["fRel","fSource","fYear"].forEach(id=>$(id).onchange=render);
$("q").oninput=render;
